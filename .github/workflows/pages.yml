name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily rebuild so build-time registry-version lookups stay current
    # without content commits.
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages reads the Pages config; it never writes in this job.
      pages: read
    env:
      HUGO_VERSION: 0.151.0
    steps:
      - name: Install Hugo CLI
        # Pin the expected sha256 of the .deb in-repo so a swapped/MITM'd or
        # tampered release fails the build instead of installing as root.
        # When bumping HUGO_VERSION, update HUGO_SHA256 from the release's
        # hugo_<version>_checksums.txt in the same change.
        env:
          HUGO_SHA256: 163ee16148303c0662c0531023a28a16158abba4062b96ffceaae9c0c8bd37fe
        run: |
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          wget -q -O "${{ runner.temp }}/${deb}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${deb}"
          echo "${HUGO_SHA256}  ${{ runner.temp }}/${deb}" | sha256sum -c -
          sudo dpkg -i "${{ runner.temp }}/${deb}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --gc --minify --baseURL "https://saltstice.com/"
      # v5 pins the upload-artifact action it calls by SHA (v3 used a tag), and
      # excludes dotfiles unless asked: /.well-known/security.txt needs them.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
