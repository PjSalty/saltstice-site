{{- define "main" }}
<header class="page-head">
  <h1>{{ .Title }}</h1>
  {{- with .Description }}<p class="lede">{{ . }}</p>{{ end }}
</header>
<div class="filter" data-filter-bar role="group" aria-label="Filter by type">
  <button type="button" data-filter="all" aria-pressed="true">All</button>
  <button type="button" data-filter="build" aria-pressed="false">Build</button>
  <button type="button" data-filter="runbook" aria-pressed="false">Runbook</button>
  <button type="button" data-filter="incident" aria-pressed="false">Incident</button>
  <button type="button" data-filter="note" aria-pressed="false">Note</button>
</div>
{{- $writing := where site.RegularPages "Section" "in" (slice "posts" "incidents") }}
<ul class="entries">
  {{- range (sort $writing "Date" "desc") }}{{ partial "entry.html" . }}{{ end }}
</ul>
{{- end }}
