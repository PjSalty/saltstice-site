{{- define "main" }}
<header class="page-head">
  <h1>{{ .Title }}</h1>
  {{- with .Description }}<p class="lede">{{ . }}</p>{{ end }}
</header>
{{- with .Content }}<div class="prose">{{ . }}</div>{{ end }}
<ul class="cards">
  {{- range .Pages.ByWeight }}{{ partial "card.html" . }}{{ end }}
</ul>
{{- end }}
