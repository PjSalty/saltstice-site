{{- define "main" }}
<header class="page-head">
  {{- partial "crumbs.html" . }}
  <h1>{{ .Title }}</h1>
  {{- with .Description }}<p class="lede">{{ . }}</p>{{ end }}
</header>
<ul class="pills">
  {{- range .Data.Terms.Alphabetical }}
  <li><a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}<span class="n">{{ .Count }}</span></a></li>
  {{- end }}
</ul>
{{- end }}
