<!DOCTYPE html>
<html lang="en">
<head>
{{- partial "head.html" . }}
</head>
<body class="pg-{{ .Kind }}{{ with .Section }} sec-{{ . }}{{ end }}">
<a class="skip" href="#main">Skip to content</a>
{{- partial "header.html" . }}
<main id="main" tabindex="-1">
{{- block "main" . }}{{ end }}
</main>
{{- partial "footer.html" . }}
{{- $app := resources.Get "js/app.js" | minify | fingerprint }}
<script src="{{ $app.RelPermalink }}" integrity="{{ $app.Data.Integrity }}" defer></script>
{{- block "scripts" . }}{{ end }}
</body>
</html>
