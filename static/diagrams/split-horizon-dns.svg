<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <style>
    .node { fill: #1e1e2e; stroke: #585b70; rx: 5; }
    .lbl { fill: #cdd6f4; font-size: 12px; }
    .sm { fill: #9399b2; font-size: 10px; }
    .wire { stroke: #45475a; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#45475a"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#181825"/>
  <text x="30" y="34" fill="#cdd6f4" font-size="13">grafana.example.com · same name, two answers</text>

  <!-- internal lane -->
  <rect x="30" y="60" width="340" height="280" fill="#1e1e2e" stroke="#a6e3a1" rx="6" opacity="0.9"/>
  <text x="46" y="84" fill="#a6e3a1" font-size="11" font-weight="bold">from the LAN</text>

  <rect class="node" x="60" y="104" width="120" height="36"/>
  <text class="lbl" x="120" y="126" text-anchor="middle">client</text>
  <path class="wire" d="M120 140 V172"/>
  <rect class="node" x="60" y="172" width="160" height="48"/>
  <text class="lbl" x="140" y="192" text-anchor="middle">AdGuard</text>
  <text class="sm" x="140" y="208" text-anchor="middle">rewrite: *.example.com</text>
  <path class="wire" d="M140 220 V252"/>
  <rect class="node" x="60" y="252" width="200" height="48"/>
  <text class="lbl" x="160" y="272" text-anchor="middle">&lt;ingress-vip&gt;</text>
  <text class="sm" x="160" y="288" text-anchor="middle">ingress VIP · stays on LAN</text>
  <text class="sm" x="46" y="326">no hairpin · no WAN round trip</text>

  <!-- external lane -->
  <rect x="390" y="60" width="340" height="280" fill="#1e1e2e" stroke="#89b4fa" rx="6" opacity="0.9"/>
  <text x="406" y="84" fill="#89b4fa" font-size="11" font-weight="bold">from the internet</text>

  <rect class="node" x="420" y="104" width="120" height="36"/>
  <text class="lbl" x="480" y="126" text-anchor="middle">client</text>
  <path class="wire" d="M480 140 V172"/>
  <rect class="node" x="420" y="172" width="160" height="48"/>
  <text class="lbl" x="500" y="192" text-anchor="middle">Cloudflare</text>
  <text class="sm" x="500" y="208" text-anchor="middle">authoritative zone</text>
  <path class="wire" d="M500 220 V252"/>
  <rect class="node" x="420" y="252" width="200" height="48"/>
  <text class="lbl" x="520" y="272" text-anchor="middle">WAN IP → router NAT</text>
  <text class="sm" x="520" y="288" text-anchor="middle">port-forward → ingress</text>
  <text class="sm" x="406" y="326">TXT challenges delegated to acme-dns</text>
</svg>
