paths:
  - id: p-site
    label: Visitor to saltstice.com
    audience: public
    description: Static portfolio site on GitHub Pages, fronted by Cloudflare (CDN, TLS, DNS). The homelab is not in this path.
    hops:
      - {node: visitor, note: "Browser requests saltstice.com"}
      - {node: cloudflare, via_link: l-vis-cf, note: "HTTPS terminates at Cloudflare edge; cached"}
      - {node: github-pages, via_link: l-cf-gh, note: "Origin is GitHub Pages (origin not re-verified)"}
  - id: p-telemetry
    label: Live telemetry on this site
    audience: public
    description: The charts and numbers on this site read a short allow-list of aggregate series through a GET-only API. Cloudflare reaches the cluster through an outbound tunnel, so no inbound port is open, and the API's Prometheus holds nothing but that allow-list.
    hops:
      - {node: visitor, note: "The page's script asks for the last two hours of each series"}
      - {node: cloudflare, via_link: l-vis-cf, note: "HTTPS, Zero Trust tunnel edge"}
      - {node: cloudflared, via_link: l-cf-cloudflared, note: "Tunnel (initiated outbound from the cluster)"}
      - {node: traefik, via_link: l-cloudflared-traefik, note: "GET on two read paths only, rate limited per client and overall"}
      - {node: prom-public, via_link: l-traefik-pp, note: "Answers range queries; allows only this site as a CORS origin"}
      - {node: prometheus, via_link: l-pp-prom, note: "Federation of the pre-aggregated allow-list every minute"}
  - id: p-jellyfin-wan
    label: Remote Jellyfin client
    audience: public
    description: A dedicated WAN port is forwarded to the Traefik VIP on its own entrypoint (jellyfin-wan), with a per-source connection cap on the router.
    hops:
      - {node: wan-client, note: "The Jellyfin app on a phone or TV, away from home"}
      - {node: rb4011, via_link: l-wan-rb, note: "TCP port forward + new-connection limit"}
      - {node: traefik, via_link: l-rb-traefik, note: "Entrypoint jellyfin-wan, TLS terminated"}
      - {node: jellyfin, via_link: l-traefik-jf, note: "HTTP to Jellyfin pods"}
      - {node: jf-postgres, via_link: l-jf-pg, note: "PostgreSQL for metadata and users"}
      - {node: jf-valkey, via_link: l-jf-valkey, note: "Cache"}
      - {node: ds-media, via_link: l-jf-media, note: "Media files over NFS from TrueNAS"}
  - id: p-lan-app
    label: LAN client to an internal app
    audience: lan
    description: Split-horizon DNS points every internal name at the Traefik VIP; the VIP is a load-balancer address that every node announces to the router over BGP.
    hops:
      - {node: lan-clients, note: "Looks up an internal app name"}
      - {node: vm-adguard, via_link: l-lan-dns, note: "DNS; router redirects stray DNS to AdGuard; wildcard rewrite to Traefik VIP"}
      - {node: rb4011, via_link: l-lan-rb, note: "Routes to the Applications VLAN; learned the /32 via BGP"}
      - {node: traefik, via_link: l-lan-traefik, note: "HTTPS with wildcard certificate"}
      - {node: authentik, via_link: l-apps-sso, note: "Forward-auth on protected routes"}
      - {node: internal-apps, via_link: l-traefik-apps, note: "IngressRoute to the pod"}
  - id: p-pvc
    label: Pod to persistent volume
    audience: internal
    description: Stateful pods claim a truenas-iscsi volume. The CSI driver asks TrueNAS (API) to create a zvol and an iSCSI target, then the node logs in over the storage VLAN.
    hops:
      - {node: internal-apps, note: "Pod with a PVC"}
      - {node: truenas-csi, via_link: l-pvc-csi, note: "Provisioner sees the claim"}
      - {node: vm-truenas, via_link: l-csi-api, note: "HTTPS API call creates zvol and target"}
      - {node: ds-iscsi, via_link: l-csi-iscsi, note: "Node initiator logs in over iSCSI"}
      - {node: pool-tank, note: "zvol lives on the RAIDZ2 pool"}
  - id: p-gitops
    label: GitOps deploy
    audience: internal
    description: Everything reaches the cluster through Git. CI builds and tags the image, Harbor stores it, Flux pulls the manifest change and applies it.
    hops:
      - {node: vm-forge, note: "git push, change merged"}
      - {node: ci-pipeline, via_link: l-git-ci, note: "Pipeline runs on CI pool nodes"}
      - {node: vm-harbor, via_link: l-ci-harbor, note: "Image pushed after tag pipeline"}
      - {node: flux, note: "Flux notices the new commit"}
      - {node: harbor-proxy, via_link: l-flux-cluster, note: "Manifests applied; nodes pull image from Harbor"}
  - id: p-backup
    label: Kubernetes backup
    audience: internal
    description: Velero writes scheduled backups to an in-cluster S3 store; a scheduled copy then lands on TrueNAS. Proxmox VM backups go straight to TrueNAS over NFS.
    hops:
      - {node: velero, note: "Daily and weekly schedules"}
      - {node: seaweedfs, via_link: l-velero-sw, note: "S3 API inside the cluster"}
      - {node: ds-backups, via_link: l-sw-nfs, note: "Scheduled NFS copy to TrueNAS"}
      - {node: pool-tank, note: "Stored on RAIDZ2"}
  - id: p-observability
    label: Metrics, logs and alerts
    audience: internal
    description: Exporters feed Prometheus, Alloy ships logs to Loki, Alertmanager sends push notifications by severity.
    hops:
      - {node: node-exporters, note: "Scraped every interval"}
      - {node: prometheus, via_link: l-exp-prom, note: "Stores series, evaluates rules"}
      - {node: alertmanager, via_link: l-prom-am, note: "Receives firing alerts"}
      - {node: pushover, via_link: l-am-push, note: "critical / warning / info receivers"}
  - id: p-logs
    label: Log shipping
    audience: internal
    description: Alloy runs on every node and pushes logs to Loki; Grafana queries them.
    hops:
      - {node: alloy, note: "DaemonSet collects pod and node logs"}
      - {node: loki, via_link: l-alloy-loki, note: "Push"}
      - {node: grafana, via_link: l-graf-loki, note: "LogQL queries"}
  - id: p-certs
    label: Certificate issuance
    audience: internal
    description: Wildcard certificate via DNS-01, so no inbound HTTP challenge is needed.
    hops:
      - {node: cert-manager, note: "Requests wildcard certificate"}
      - {node: cloudflare, via_link: l-cm-cf, note: "TXT record created via API"}
      - {node: letsencrypt, via_link: l-cm-le, note: "ACME validation and issuance"}
