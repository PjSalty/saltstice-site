meta:
  verified: "2026-11-01"
  notes: "Built from live MCP reads (Proxmox, Kubernetes, MetalLB, MikroTik, TrueNAS, UniFi, Karpenter, Velero) and origin/main of the Kubernetes repo. Names and roles only; no addresses. Nodes marked unverified: true could not be confirmed live."

zones:
  - {id: z-internet, label: Internet, kind: internet, description: "Public internet, Cloudflare edge and GitHub Pages."}
  - {id: z-edge, label: Edge and network core, kind: edge, description: "ISP uplink, router, switches, access points and power."}
  - {id: z-infra, label: Infrastructure VLAN, kind: vlan, description: "Core VMs: DNS, Git, registry, CI runner, load balancers, game server, Wi-Fi controller."}
  - {id: z-k8s, label: Kubernetes VLAN, kind: vlan, description: "Kubernetes nodes and pod traffic."}
  - {id: z-storage, label: Storage VLAN, kind: storage, description: "TrueNAS data path for NFS and iSCSI."}
  - {id: z-apps, label: Applications VLAN, kind: vlan, description: "Load-balancer address pool for user-facing services; Traefik VIP lives here."}
  - {id: z-client, label: Client VLANs, kind: vlan, description: "Trusted, wireless and isolated client networks"}
  - {id: z-cluster, label: Kubernetes cluster, kind: cluster, description: "RKE2 cluster managed by Flux. Overlay across the Kubernetes VLAN."}

nodes:
  # --- internet / external
  - {id: visitor, label: Public visitor, kind: client, zone: z-internet, role: "Anonymous web visitor", tags: [public]}
  - {id: wan-client, label: Remote Jellyfin client, kind: client, zone: z-internet, role: "Phone, TV or browser outside the house", tags: [public]}
  - {id: cloudflare, label: Cloudflare, kind: cloudflare, zone: z-internet, role: "DNS, CDN/proxy, Zero Trust tunnel edge, DNS-01 for certificates", tags: [dns, cdn, tunnel]}
  - {id: github-pages, label: GitHub Pages, kind: github, zone: z-internet, role: "Hosts the saltstice.com portfolio site", tags: [static], unverified: true}
  - {id: letsencrypt, label: Let's Encrypt, kind: external, zone: z-internet, role: "ACME CA for wildcard certificates", tags: [tls]}
  - {id: pushover, label: Push notifications, kind: external, zone: z-internet, role: "Alert delivery (critical, warning, info receivers)", tags: [alerts]}

  # --- edge
  - {id: isp, label: ISP uplink, kind: isp, zone: z-edge, role: "Residential WAN uplink", unverified: true, tags: [wan]}
  - {id: rb4011, label: MikroTik RB4011, kind: router, zone: z-edge, role: "Core router: inter-VLAN routing and firewall, NAT and port forwards, BGP peer for Kubernetes, DNS enforcement, WireGuard", specs: ["RouterOS", "BGP with Kubernetes nodes", "two WireGuard interfaces"], tags: [router, firewall]}
  - {id: crs317, label: MikroTik CRS317, kind: switch, zone: z-edge, role: "10G SFP+ aggregation switch toward the hypervisor", specs: ["16x SFP+ class"], tags: [10g]}
  - {id: crs328, label: MikroTik CRS328, kind: switch, zone: z-edge, role: "PoE access switch for APs and wired clients", specs: ["24x GbE PoE class"], tags: [poe]}
  - {id: ap-fleet, label: Access points, kind: ap, zone: z-edge, role: "UniFi access points (U6 Lite x2, AC LR)", tags: [wifi]}
  - {id: ups, label: UPS, kind: ups, zone: z-edge, role: "Battery backup for rack", unverified: true, tags: [power]}

  # --- host
  - {id: r740xd, label: Dell PowerEdge R740xd, kind: host, zone: z-infra, role: "Single Proxmox VE hypervisor running every VM", specs: ["2x Xeon Gold 6242R (40 cores / 80 threads)", "256 GiB RAM", "NVIDIA RTX A2000 GPU passthrough to one worker"], tags: [proxmox, hypervisor]}

  # --- infra VMs
  - {id: vm-truenas, label: truenas, kind: vm, zone: z-storage, parent: r740xd, role: "TrueNAS SCALE storage appliance (NFS, iSCSI, SMB, S3-backed backups target)", tags: [storage]}
  - {id: vm-harbor, label: harbor, kind: registry, zone: z-infra, parent: r740xd, role: "Container registry and Docker Hub proxy cache", tags: [registry]}
  - {id: vm-forge, label: git-forge, kind: vm, zone: z-infra, parent: r740xd, role: "Git hosting, CI/CD pipelines, source of truth for GitOps", tags: [git, ci]}
  - {id: vm-netbox, label: netbox, kind: vm, zone: z-infra, parent: r740xd, role: "IPAM / DCIM inventory", tags: [inventory]}
  - {id: vm-adguard, label: adguard, kind: dns, zone: z-infra, parent: r740xd, role: "Primary DNS resolver with wildcard split-horizon rewrite", tags: [dns]}
  - {id: vm-adguard-2, label: adguard-2, kind: dns, zone: z-infra, parent: r740xd, role: "Secondary DNS resolver (HA pair, shared virtual IP)", tags: [dns, ha]}
  - {id: vm-ci-runner, label: ci-runner, kind: ci, zone: z-infra, parent: r740xd, role: "Shell CI runner for Terraform and Ansible deploy jobs", tags: [ci]}
  - {id: vm-haproxy-1, label: haproxy-1, kind: lb, zone: z-infra, parent: r740xd, role: "Kubernetes API load balancer (active), keepalived pair", tags: [ha, api]}
  - {id: vm-haproxy-2, label: haproxy-2, kind: lb, zone: z-infra, parent: r740xd, role: "Kubernetes API load balancer (standby), keepalived pair", tags: [ha, api]}
  - {id: vm-unifi-os, label: unifi-os, kind: vm, zone: z-infra, parent: r740xd, role: "UniFi OS Wi-Fi controller", tags: [wifi, controller]}

  # --- k8s VMs
  - {id: vm-masters, label: k8s-master-1..3, kind: k8s-control, zone: z-cluster, parent: r740xd, role: "RKE2 control plane + etcd, tainted so no apps run here", specs: ["3 VMs"], count: 3, tags: [rke2, control-plane]}
  - {id: vm-worker-1, label: k8s-worker-1, kind: k8s-worker, zone: z-cluster, parent: r740xd, role: "GPU worker (RTX A2000 passthrough, NVIDIA device plugin)", specs: ["GPU"], tags: [gpu, worker]}
  - {id: vm-worker-2, label: k8s-worker-2, kind: k8s-worker, zone: z-cluster, parent: r740xd, role: "General worker", tags: [worker]}
  - {id: vm-worker-3, label: k8s-worker-3, kind: k8s-worker, zone: z-cluster, parent: r740xd, role: "General worker", tags: [worker]}
  - {id: pool-ci, label: ci-pool (Karpenter), kind: k8s-pool, zone: z-cluster, parent: r740xd, role: "Autoscaled, tainted CI build workers; created on demand from a VM template, removed when empty (24 h max age)", tags: [karpenter, autoscaled]}
  - {id: pool-general, label: Karpenter general pools, kind: k8s-pool, zone: z-cluster, parent: r740xd, role: "Standard, compute and memory pools defined but capped at zero nodes", tags: [karpenter, idle]}

  # --- network services
  - {id: bgp-speaker, label: MetalLB (BGP speaker), kind: lb, zone: z-cluster, role: "Assigns load-balancer addresses and announces each as a /32 over BGP to the RB4011", tags: [metallb, bgp]}
  - {id: cilium, label: Cilium CNI, kind: service, zone: z-cluster, role: "eBPF CNI: kube-proxy replacement, native routing, DSR with Maglev, host firewall, Hubble relay", tags: [cni, ebpf]}
  - {id: traefik, label: Traefik (main), kind: ingress, zone: z-cluster, role: "Primary ingress: entrypoints web, websecure, jellyfin-wan, metrics; 3-6 replicas via HPA", tags: [ingress]}
  - {id: traefik-dmz, label: Traefik (DMZ), kind: ingress, zone: z-cluster, role: "Isolated ingress for DMZ-published apps: websecure and metrics only, CRD-only, no ExternalName", tags: [ingress, dmz]}
  - {id: cloudflared, label: cloudflared, kind: service, zone: z-cluster, role: "Outbound-only Cloudflare tunnel connector (HPA-scaled); routes configured in Cloudflare Zero Trust", tags: [tunnel]}
  - {id: cert-manager, label: cert-manager, kind: service, zone: z-cluster, role: "Issues wildcard TLS via Let's Encrypt using DNS-01 on Cloudflare", tags: [tls]}
  - {id: external-dns, label: external-dns / DNS sync, kind: service, zone: z-cluster, role: "Syncs public DNS records into Cloudflare from cluster state (CronJob) ; internal records handled by an AdGuard sync job", tags: [dns]}
  - {id: kyverno, label: Kyverno, kind: service, zone: z-cluster, role: "Admission policy engine (security baselines, no apps on control plane)", tags: [policy]}
  - {id: netpol, label: NetworkPolicies, kind: service, zone: z-cluster, role: "Default-deny ingress and egress per namespace with explicit allows", tags: [policy]}
  - {id: flux, label: Flux, kind: gitops, zone: z-cluster, role: "Reconciles the cluster from Git: manifests source plus a separate SOPS-encrypted secrets source", tags: [gitops]}
  - {id: karpenter, label: Karpenter (Proxmox provider), kind: service, zone: z-cluster, role: "Creates and deletes CI worker VMs on demand", tags: [autoscaling]}

  # --- apps
  - {id: jellyfin, label: Jellyfin pods, kind: service, zone: z-cluster, role: "Media server, multiple pods, GPU transcoding capable", tags: [media]}
  - {id: jf-postgres, label: Jellyfin PostgreSQL, kind: database, zone: z-cluster, role: "Database for Jellyfin", tags: [sql]}
  - {id: jf-valkey, label: Jellyfin Valkey, kind: cache, zone: z-cluster, role: "Redis-compatible cache for Jellyfin", tags: [redis]}
  - {id: internal-apps, label: Internal apps, kind: service, zone: z-cluster, role: "SSO (Authentik), docs, dashboards, notifications and other LAN-only services behind Traefik", tags: [apps]}
  - {id: authentik, label: Authentik SSO, kind: service, zone: z-cluster, role: "Identity provider and forward-auth for protected routes", tags: [sso]}
  - {id: dmz-apps, label: DMZ apps, kind: service, zone: z-cluster, role: "Internet-facing chat/community services published through the DMZ ingress", tags: [dmz]}
  - {id: prom-public, label: Prometheus (public), kind: observability, zone: z-cluster, role: "Isolated Prometheus that stores only an allow-list of pre-aggregated public series, pulled by federation", tags: [status, public]}
  - {id: prometheus, label: Prometheus, kind: observability, zone: z-cluster, role: "Main metrics store (kube-prometheus-stack); scrapes nodes, VMs, network gear, the hypervisor and TrueNAS", tags: [metrics]}
  - {id: alertmanager, label: Alertmanager, kind: observability, zone: z-cluster, role: "Routes alerts to push notification receivers by severity", tags: [alerts]}
  - {id: grafana, label: Grafana, kind: observability, zone: z-cluster, role: "Internal dashboards behind SSO", tags: [dashboards]}
  - {id: loki, label: Loki, kind: observability, zone: z-cluster, role: "Log storage", tags: [logs]}
  - {id: alloy, label: Alloy, kind: observability, zone: z-cluster, role: "Log and telemetry collector DaemonSet", tags: [logs]}
  - {id: node-exporters, label: Exporters, kind: observability, zone: z-cluster, role: "node-exporter on VMs, plus hypervisor, storage and network exporters", tags: [metrics]}
  - {id: tempo, label: Tempo, kind: observability, zone: z-cluster, role: "Distributed tracing store", tags: [traces]}
  - {id: velero, label: Velero, kind: backup, zone: z-cluster, role: "Kubernetes backup: scheduled daily and weekly backups, 7-day and 28-day retention", tags: [backup]}
  - {id: seaweedfs, label: SeaweedFS S3, kind: storage, zone: z-cluster, role: "In-cluster S3 object store used as the Velero backup location", tags: [s3]}
  - {id: truenas-csi, label: truenas-csi driver, kind: service, zone: z-cluster, role: "CSI driver provisioning iSCSI volumes as zvols on TrueNAS (storage class truenas-iscsi)", tags: [csi, iscsi]}
  - {id: nfs-csi, label: NFS client provisioner, kind: service, zone: z-cluster, role: "Dynamic NFS volumes from TrueNAS (storage class nfs-client)", tags: [csi, nfs]}
  - {id: harbor-proxy, label: Image pulls via Harbor, kind: service, zone: z-cluster, role: "Cluster pulls images from Harbor, including a Docker Hub proxy project", tags: [registry]}

  # --- storage
  - {id: pool-tank, label: ZFS pool tank, kind: storage, zone: z-storage, parent: vm-truenas, role: "Main data pool: 12-disk RAIDZ2 vdev, ~72 TB raw", specs: ["RAIDZ2", "12 disks"], tags: [zfs]}
  - {id: ds-media, label: Media datasets, kind: storage, zone: z-storage, parent: pool-tank, role: "Media library and ingest drop, shared by NFS", tags: [nfs, media]}
  - {id: ds-k8s, label: Kubernetes datasets, kind: storage, zone: z-storage, parent: pool-tank, role: "NFS PV data and Jellyfin config/cache/transcode scratch", tags: [nfs]}
  - {id: ds-iscsi, label: iSCSI zvols, kind: storage, zone: z-storage, parent: pool-tank, role: "CSI-provisioned iSCSI targets, one per database or stateful PVC", tags: [iscsi]}
  - {id: ds-backups, label: Backup datasets, kind: backup, zone: z-storage, parent: pool-tank, role: "Proxmox vzdump backups and SeaweedFS backup copies", tags: [backup]}
  - {id: boot-pool, label: Hypervisor ZFS pool, kind: storage, zone: z-infra, parent: r740xd, role: "Local ZFS (VM system disks) on the hypervisor", unverified: true, tags: [zfs]}

  # --- client VLAN nodes
  - {id: lan-clients, label: LAN clients, kind: client, zone: z-client, role: "Trusted and Wireless VLAN devices", tags: [lan]}
  - {id: wifi-clients, label: Trusted Wi-Fi clients, kind: client, zone: z-client, role: "Trusted Wi-Fi VLAN, DNS plus Traefik apps plus internet only", tags: [wifi]}
  - {id: iot-clients, label: IoT and Guest, kind: client, zone: z-client, role: "Internet only; blocked from all private ranges", tags: [isolated]}
  - {id: ci-pipeline, label: CI pipeline, kind: ci, zone: z-infra, role: "Pipelines: Go/Terraform/Ansible builds, image tags", tags: [ci]}

