baseURL: https://saltstice.com/
title: Salty
languageCode: en-us
enableEmoji: true
enableRobotsTXT: true
# Page dates come from git (the Pages build checks out full history), so a
# "last updated" line can never be a hand-typed date that goes stale.
enableGitInfo: true
# No <meta name="generator"> with the exact Hugo version in every page head.
disableHugoGeneratorInject: true
buildDrafts: false
buildFuture: false
buildExpired: false

permalinks:
  posts: /posts/:slug/
  incidents: /incidents/:slug/
  projects: /projects/:slug/

taxonomies:
  tag: tags
  type: types
  topic: topics

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

mainSections:
  - posts
  - incidents

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: github
    codeFences: true
    lineNos: false
  tableOfContents:
    startLevel: 2
    endLevel: 3

params:
  env: production
  description: Platform engineer. Notes on running a production homelab as code.
  author: Salty
  featuredProjects:
    - terraform-provider-truenas
    - terraform-provider-unifi
    - homelab-cli
    - saltstice-homelab
    - jellyfin-fork
    - jellyfin-pgsql
  topology:
    host: r740xd
    layers:
      - id: internet
        label: Internet
        zones: [z-internet]
        groups:
          - {label: Internet, zone: z-internet, w: 100}
      - id: edge
        label: Edge
        zones: [z-edge, z-client]
        groups:
          - {label: Network core, zone: z-edge, w: 60}
          - {label: Client VLANs, zone: z-client, w: 40}
      - id: host
        label: Proxmox host
        groups:
          - {label: Infrastructure VLAN, zone: z-infra, view: cols, w: 50, tall: true}
          - {label: Kubernetes nodes, zone: z-cluster, view: list, w: 30, tall: true}
          - {label: Storage VLAN, zone: z-storage, w: 20}
      - id: cluster
        label: Kubernetes
        zones: [z-cluster, z-infra]
        groups:
          - {label: Traffic and DNS, view: list, w: 20, ids: [bgp-speaker, cilium, traefik, traefik-dmz, cloudflared, cert-manager, external-dns]}
          - {label: GitOps and policy, view: list, w: 20, ids: [flux, kyverno, netpol, karpenter, harbor-proxy, ci-pipeline]}
          - {label: Apps, view: list, w: 20, ids: [jellyfin, jf-postgres, jf-valkey, internal-apps, authentik, dmz-apps]}
          - {label: Observability, view: list, w: 20, ids: [prometheus, prom-public, alertmanager, grafana, loki, alloy, node-exporters, tempo]}
          - {label: Storage and backup, view: list, w: 20, ids: [truenas-csi, nfs-csi, velero, seaweedfs]}
      - id: storage
        label: Storage
        zones: [z-storage]
        groups:
          - {label: TrueNAS pool, zone: z-storage, w: 100}
  telemetry:
    endpoint: https://status.saltstice.com/api/v1
    series:
      - {q: "public:cpu_utilization:ratio", label: CPU, note: cluster utilization, fmt: pct, role: main}
      - {q: "public:memory_utilization:ratio", label: Memory, note: cluster utilization, fmt: pct, role: main}
      - {q: "public:nodes_ready:count", label: Nodes ready, note: Kubernetes nodes, fmt: count}
      - {q: "public:pods_running:count", label: Pods running, note: across the cluster, fmt: count}
      - {q: "public:targets_healthy:ratio", label: Targets healthy, note: scrape targets up, fmt: pct}
  hero:
    eyebrow: Platform engineer
    title: Production homelab, run as code.
    lead: One Dell R740xd running Proxmox, RKE2, Cilium, Flux, Terraform and TrueNAS, with every change shipped through Git.

menu:
  main:
    - {identifier: writing, name: Writing, url: /writing/, weight: 10}
    - {identifier: incidents, name: Incidents, url: /incidents/, weight: 20}
    - {identifier: projects, name: Projects, url: /projects/, weight: 30}
    - {identifier: lab, name: Lab, url: /lab/, weight: 40}
    - {identifier: about, name: About, url: /about/, weight: 50}
