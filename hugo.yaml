baseURL: https://saltstice.com/
title: Salty
languageCode: en-us
enableEmoji: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

permalinks:
  posts: /posts/:slug/
  incidents: /incidents/:slug/
  projects: /projects/:slug/

taxonomies:
  tag: tags
  type: types
  topic: topics

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

mainSections:
  - posts
  - incidents

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: github
    codeFences: true
    lineNos: false
  tableOfContents:
    startLevel: 2
    endLevel: 3

params:
  env: production
  description: Platform engineer. Notes on running a production homelab as code.
  author: Salty
  featuredProjects:
    - terraform-provider-truenas
    - terraform-provider-unifi
    - homelab-cli
    - saltstice-homelab
    - jellyfin-fork
    - jellyfin-pgsql
  topology:
    host: r740xd
    layers:
      - {id: internet, label: Internet and remote site, zones: [z-internet, z-remote]}
      - {id: edge, label: Edge and network core, zones: [z-edge, z-client], cols: 5}
      - {id: host, label: Proxmox host, zones: [z-mgmt, z-infra, z-storage, z-dmz, z-cluster], cols: 5, labels: {z-cluster: Kubernetes nodes}}
      - id: cluster
        label: Kubernetes services
        zones: [z-cluster, z-infra]
        cols: 3
        groups:
          - {label: Traffic and DNS, ids: [bgp-speaker, cilium, traefik, traefik-dmz, cloudflared, cert-manager, external-dns]}
          - {label: GitOps and policy, ids: [flux, kyverno, netpol, karpenter, harbor-proxy, ci-pipeline]}
          - {label: Apps, ids: [jellyfin, jf-postgres, jf-valkey, internal-apps, authentik, dmz-apps]}
          - {label: Observability, ids: [prometheus, alertmanager, grafana, loki, alloy, node-exporters, tempo, prom-public]}
          - {label: Storage and backup, ids: [truenas-csi, nfs-csi, velero, seaweedfs]}
      - {id: storage, label: TrueNAS storage, zones: [z-storage], cols: 5}
    hero: [visitor, cloudflare, rb4011, crs317, crs328, vm-masters, vm-worker-1, vm-worker-2, vm-worker-3, pool-ci, vm-truenas, bgp-speaker, cilium, traefik, flux, pool-tank]
  telemetry:
    endpoint: https://status.saltstice.com/api/v1
    series:
      - {q: "public:cpu_utilization:ratio", label: CPU, note: cluster utilization, fmt: pct}
      - {q: "public:memory_utilization:ratio", label: Memory, note: cluster utilization, fmt: pct}
      - {q: "public:nodes_ready:count", label: Nodes ready, note: Kubernetes nodes, fmt: count}
      - {q: "public:pods_running:count", label: Pods running, note: across the cluster, fmt: count}
      - {q: "public:targets_healthy:ratio", label: Targets healthy, note: scrape targets up, fmt: pct}
  hero:
    eyebrow: Platform engineer
    title: Running a production homelab as code.

menu:
  main:
    - {identifier: writing, name: Writing, url: /writing/, weight: 10}
    - {identifier: incidents, name: Incidents, url: /incidents/, weight: 20}
    - {identifier: projects, name: Projects, url: /projects/, weight: 30}
    - {identifier: lab, name: Lab, url: /lab/, weight: 40}
    - {identifier: about, name: About, url: /about/, weight: 50}
