baseURL: https://saltstice.com/
title: Salty
languageCode: en-us
enableEmoji: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

permalinks:
  posts: /posts/:slug/
  incidents: /incidents/:slug/
  projects: /projects/:slug/

taxonomies:
  tag: tags
  type: types
  topic: topics

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

mainSections:
  - posts
  - incidents

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: github
    codeFences: true
    lineNos: false
  tableOfContents:
    startLevel: 2
    endLevel: 3

params:
  env: production
  description: Platform engineer. Notes on running a production homelab as code.
  author: Salty
  featuredProjects:
    - terraform-provider-truenas
    - terraform-provider-unifi
    - homelab-cli
    - saltstice-homelab
    - jellyfin-fork
    - jellyfin-pgsql
  hero:
    eyebrow: Platform engineer
    title: Running a production homelab as code.

menu:
  main:
    - {identifier: writing, name: Writing, url: /writing/, weight: 10}
    - {identifier: incidents, name: Incidents, url: /incidents/, weight: 20}
    - {identifier: projects, name: Projects, url: /projects/, weight: 30}
    - {identifier: lab, name: Lab, url: /lab/, weight: 40}
    - {identifier: about, name: About, url: /about/, weight: 50}
