baseURL: https://saltstice.com/
title: Salty
languageCode: en-us
enableEmoji: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

permalinks:
  posts: /posts/:slug/
  incidents: /incidents/:slug/
  projects: /projects/:slug/

taxonomies:
  tag: tags
  type: types
  topic: topics

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

mainSections:
  - posts
  - incidents

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: github
    codeFences: true
    lineNos: false

params:
  env: production
  description: Platform engineer. Notes on running a production homelab as code.
  author: Salty

menu:
  main:
    - {identifier: writing, name: Writing, url: /writing/, weight: 10}
    - {identifier: incidents, name: Incidents, url: /incidents/, weight: 20}
    - {identifier: projects, name: Projects, url: /projects/, weight: 30}
    - {identifier: lab, name: Lab, url: /lab/, weight: 40}
    - {identifier: telemetry, name: Telemetry, url: /telemetry/, weight: 50}
    - {identifier: about, name: About, url: /about/, weight: 60}
    - {identifier: search, name: Search, url: /search/, weight: 70}
